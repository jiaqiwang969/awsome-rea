name: Catalog checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog and bilingual pages
        run: python3 scripts/build_catalog.py --check
      - name: Check whitespace
        run: git diff-tree --check --root -r HEAD
